<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XAS Allocation Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e7ee;
    --fg: #1e2430; --dim: #6b7484; --accent: #2f6feb; --warn: #b45309; --err: #c02626;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr;
         background: var(--bg); color: var(--fg); font-size: 14px; }

  aside { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
             color: var(--dim); margin: 0; padding: 16px; border-bottom: 1px solid var(--line); }
  .controls { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .sessions { overflow-y: auto; padding: 8px; flex: 1; min-height: 0; }
  .session { padding: 8px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .session:hover { background: #eef1f5; }
  .session.viewing { border-color: var(--accent); background: #eaf1ff; }
  .session .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--fg);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

  main { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 12px; align-items: center; background: var(--panel); }
  #title { font-family: ui-monospace, monospace; font-size: 12px; }
  #status { font-size: 12px; color: var(--dim); }
  #status.running { color: var(--accent); }
  #status.error { color: var(--err); }

  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex;
                flex-direction: column; gap: 10px; min-height: 0; }
  .msg { max-width: 780px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
         overflow-wrap: anywhere; line-height: 1.5; }
  .msg.user { background: #dce8ff; align-self: flex-end; }
  .msg.agent { background: var(--panel); border: 1px solid var(--line); }
  .msg.tool { background: transparent; color: var(--dim); font-family: ui-monospace, monospace;
              font-size: 12px; padding: 2px 12px; }
  .msg.tool b { color: var(--warn); font-weight: 600; }
  .msg.tool_result { background: #f2f4f8; border: 1px solid var(--line);
                     font-family: ui-monospace, monospace; font-size: 12px; }
  .msg.tool_result summary { cursor: pointer; color: var(--warn); }
  .msg.tool_result pre { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
                         max-height: 320px; overflow-y: auto; color: var(--fg); }
  .msg.error { background: #fdeaea; color: #8a1c1c; border: 1px solid #f2c2c2; }
  .msg.output { background: var(--panel); border: 1px solid var(--line); white-space: normal; }
  .msg.output .output-name { font-weight: 600; margin-bottom: 6px; }
  .msg.output .dim { color: var(--dim); font-weight: 400; }
  /* Charts vary wildly in size; cap the height so a wide bar chart doesn't
     push the transcript off screen. Click opens it full size in a new tab. */
  .msg.output .output-img { display: block; max-width: 100%; max-height: 460px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: zoom-in; }
  /* An iframe has no intrinsic size, so the height is ours to choose. 460px
     matches the image cap; the chart scales to width and "open in new tab"
     covers anyone who wants it full size. */
  .msg.output .output-frame { display: block; width: 100%; height: 460px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; }
  .msg.output .output-open { font-weight: 400; font-size: 12px; margin-left: 6px; }

  footer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px;
           background: var(--panel); }
  textarea { flex: 1; resize: none; height: 62px; background: #fff; color: var(--fg);
             border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  button, select { background: #eef1f5; color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  #send { min-width: 76px; }

  /* Rendered markdown inside an agent message (tables, code, diagrams). */
  .msg.agent.md { white-space: normal; }
  .msg.agent.md > :first-child { margin-top: 0; }
  .msg.agent.md > :last-child { margin-bottom: 0; }
  .msg.agent.md h1, .msg.agent.md h2, .msg.agent.md h3 { margin: .5em 0 .3em; font-size: 1.05em; }
  .msg.agent.md p { margin: .4em 0; }
  .msg.agent.md ul, .msg.agent.md ol { margin: .3em 0; padding-left: 1.3em; }
  .msg.agent.md code { background: #eef1f5; border: 1px solid var(--line); border-radius: 4px;
                       padding: 0 3px; font-family: ui-monospace, monospace; font-size: .92em; }
  .msg.agent.md pre.code { background: #f2f4f8; border: 1px solid var(--line); border-radius: 6px;
                           padding: 8px; overflow-x: auto; }
  .msg.agent.md pre.code code { background: none; border: none; padding: 0; }
  .msg.agent.md table { border-collapse: collapse; margin: .5em 0; font-size: .92em;
                        display: block; overflow-x: auto; }
  .msg.agent.md th, .msg.agent.md td { border: 1px solid var(--line); padding: 5px 9px;
                                       text-align: left; white-space: nowrap; }
  .msg.agent.md thead th { background: #eef1f5; }
  .msg.agent.md pre.mermaid { background: transparent; text-align: center; border: 0; }
  .msg.agent.md pre.mermaid.mermaid-fallback { background: #f2f4f8; border: 1px solid var(--line);
      border-radius: 6px; padding: 8px; text-align: left; white-space: pre; overflow-x: auto;
      font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<aside>
  <h1>XAS Allocation</h1>
  <div class="controls">
    <select id="model"></select>
    <button id="new" class="primary">New session</button>
    <button id="end" class="danger" disabled>End session</button>
  </div>
  <div class="sessions" id="sessions"></div>
</aside>

<main>
  <header>
    <strong id="title">No session</strong>
    <span id="status">idle</span>
  </header>
  <div id="transcript"></div>
  <footer>
    <textarea id="input" placeholder="Describe the disruption and your steering instruction…" disabled></textarea>
    <button id="send" class="primary" disabled>Send</button>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let active = null;   // the server's active session — the one messages reach
let viewing = null;  // the session whose transcript is on screen
let running = false; // is the agent currently working?
let stream = null;

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

const escape = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function setStatus(text, cls = "") {
  $("status").textContent = text;
  $("status").className = cls;
}

function refreshControls() {
  const messageable = !!active && viewing === active;   // can only send to the active session
  $("input").disabled = !messageable;
  $("end").disabled = !messageable;
  $("title").textContent = viewing || "No session";

  const send = $("send");
  if (messageable && running) {
    // While the agent is thinking, Send becomes Stop (interrupt).
    send.disabled = false;
    send.textContent = "Stop";
    send.className = "danger";
  } else {
    send.disabled = !messageable;
    send.textContent = "Send";
    send.className = "primary";
  }
}

function add(kind, html) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  $("transcript").append(div);
  $("transcript").scrollTop = $("transcript").scrollHeight;
}

// --- Minimal, dependency-free Markdown -> safe HTML (tables, code, headings,
//     lists, bold/inline-code). Everything is escaped first, so only our own
//     tags reach innerHTML. ```mermaid blocks become <pre class="mermaid">. ---
function mdInline(s) {  // s is already HTML-escaped
  return s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+?)`/g, "<code>$1</code>");
}
function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((c) => c.trim());
}
function renderMarkdown(src) {
  const lines = (src || "").split("\n");
  const isTable = (i) =>
    i + 1 < lines.length && lines[i].includes("|") &&
    lines[i + 1].includes("-") && /^[\s:|-]+$/.test(lines[i + 1]);
  const blockStart = (i) => {
    if (i >= lines.length) return true;
    const l = lines[i];
    return l.trim() === "" || l.startsWith("```") || /^#{1,6}\s/.test(l)
      || /^\s*([-*]|\d+\.)\s+/.test(l) || isTable(i);
  };
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      const body = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) { body.push(lines[i]); i++; }
      i++;
      const code = escape(body.join("\n"));
      html += fence[1] === "mermaid"
        ? `<pre class="mermaid">${code}</pre>`
        : `<pre class="code"><code>${code}</code></pre>`;
      continue;
    }
    if (isTable(i)) {
      const header = splitRow(line);
      i += 2;
      let t = "<table><thead><tr>" + header.map((h) => `<th>${mdInline(escape(h))}</th>`).join("")
        + "</tr></thead><tbody>";
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        t += "<tr>" + splitRow(lines[i]).map((c) => `<td>${mdInline(escape(c))}</td>`).join("") + "</tr>";
        i++;
      }
      html += t + "</tbody></table>";
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; html += `<h${n}>${mdInline(escape(h[2]))}</h${n}>`; i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const tag = ordered ? "ol" : "ul";
      let l = `<${tag}>`;
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        l += `<li>${mdInline(escape(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")))}</li>`;
        i++;
      }
      html += l + `</${tag}>`;
      continue;
    }
    if (line.trim() === "") { i++; continue; }
    const buf = [line];
    i++;
    while (i < lines.length && !blockStart(i)) { buf.push(lines[i]); i++; }
    html += `<p>${mdInline(escape(buf.join(" ")))}</p>`;
  }
  return html;
}

// Mermaid is optional: loaded lazily from a CDN by the viewer's browser (not
// bundled). If it can't load, the ```mermaid block stays a readable code block.
let _mermaidP = null;
function ensureMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (_mermaidP) return _mermaidP;
  _mermaidP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js";
    s.onload = () => {
      try { window.mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" }); }
      catch (e) { /* ignore */ }
      res(window.mermaid);
    };
    s.onerror = () => rej(new Error("mermaid load failed"));
    document.head.appendChild(s);
  });
  return _mermaidP;
}
function runMermaid(container) {
  const nodes = [...container.querySelectorAll("pre.mermaid")];
  if (!nodes.length) return;
  ensureMermaid()
    .then((m) => m.run({ nodes }))
    .catch(() => nodes.forEach((n) => n.classList.add("mermaid-fallback")));
}
function addAgent(text) {
  const div = document.createElement("div");
  div.className = "msg agent md";
  div.innerHTML = renderMarkdown(text);
  $("transcript").append(div);
  $("transcript").scrollTop = $("transcript").scrollHeight;
  runMermaid(div);
}

function render(event) {
  switch (event.type) {
    case "user":  return add("user", escape(event.text));
    case "agent": return addAgent(event.text);
    case "tool":  return add("tool", `<b>${escape(event.name)}</b> ${escape(event.detail)}`);
    case "tool_result":
      return add("tool_result",
        `<details><summary>pull result (${event.text.length} chars)</summary>`
        + `<pre>${escape(event.text)}</pre></details>`);
    case "error": return add("error", escape(event.text));
    case "status":
      if (event.status === "running") { running = true; setStatus("running…", "running"); }
      else if (event.status === "idle") {
        if (event.stop_reason === "requires_action") { running = true; setStatus("working (pulling data)…", "running"); }
        else { running = false; setStatus("idle"); }
      } else { running = false; setStatus(event.status); }
      if (event.check_files) showNewOutputs();
      refreshControls();
      return;
  }
}

// --- Agent outputs (charts, reports) -------------------------------------
// The agent writes files into its sandbox; they are indexed a beat AFTER the
// turn goes idle, so poll briefly rather than asking once and giving up.
const shownFiles = new Set();

async function showNewOutputs(attempt = 0) {
  // `viewing`, not `active`: the stream we are rendering belongs to the session
  // on screen, which is not always the one messages go to.
  const sid = viewing;
  if (!sid) return;
  let files = [];
  try {
    ({ files } = await api(`/session/${sid}/files`));
  } catch { return; }

  const fresh = files.filter((f) => !shownFiles.has(f.id));
  if (!fresh.length) {
    // Up to ~4s of retries: outputs lag idle by 1-3s.
    if (attempt < 4 && viewing === sid) setTimeout(() => showNewOutputs(attempt + 1), 1000);
    return;
  }
  for (const f of fresh) {
    shownFiles.add(f.id);
    const url = `/session/${sid}/files/${f.id}/content`;
    const name = escape(f.filename || f.id);
    const kb = Math.max(1, Math.round((f.size_bytes || 0) / 1024));
    // Header is the same for every output; only the body differs by render mode.
    const head = `<div class="output-name">${name} <span class="dim">${kb} KB</span>`
      + ` <a class="output-open" href="${url}" target="_blank" rel="noopener">open in new tab \u2197</a></div>`;
    let body;
    if (f.render === "frame") {
      // The chart is model-generated HTML, so it goes in a sandbox with an
      // OPAQUE origin: allow-scripts without allow-same-origin means it can
      // render (and animate, if it ever ships an interactive chart) but cannot
      // touch this page, its cookies, or the session routes.
      body = `<iframe class="output-frame" src="${url}" sandbox="allow-scripts"`
        + ` title="${name}" loading="lazy"></iframe>`;
    } else if (f.render === "image") {
      body = `<a href="${url}" target="_blank" rel="noopener">`
        + `<img class="output-img" src="${url}" alt="${name}"></a>`;
    } else {
      body = "";   // the header's link is the whole offer
    }
    add("output", head + body);
  }
}

function follow(id) {
  if (stream) stream.close();
  running = false;
  shownFiles.clear();
  $("transcript").replaceChildren();
  stream = new EventSource(`/session/${id}/events`);
  stream.onmessage = (e) => render(JSON.parse(e.data));
  stream.onerror = () => setStatus("stream lost — reload to resume", "error");
}

async function listSessions() {
  const { sessions } = await api("/sessions");
  $("sessions").replaceChildren(...sessions.map((s) => {
    const div = document.createElement("div");
    div.className = "session" + (s.id === viewing ? " viewing" : "");
    const tags = [s.status, s.model || "—"];
    if (s.id === active) tags.push("active");
    if (s.archived) tags.push("archived");
    div.innerHTML = `<div class="id">${escape(s.id)}</div>`
      + `<div class="meta">${escape(tags.join(" · "))}</div>`;
    div.onclick = () => selectSession(s);
    return div;
  }));
}

async function selectSession(s) {
  if (s.archived) {
    // Read-only: show the transcript but don't make it the active session.
    viewing = s.id;
    follow(s.id);
    setStatus("archived — read-only");
    await listSessions();
    refreshControls();
    return;
  }
  try {
    await api(`/session/${s.id}/activate`, { method: "POST" });
    active = s.id;
    viewing = s.id;
    follow(s.id);
  } catch (e) { add("error", escape(e.message)); return; }
  await listSessions();
  refreshControls();
}

async function newSession() {
  $("new").disabled = true;
  try {
    const res = await api("/session", { method: "POST", body: JSON.stringify({ model: $("model").value }) });
    active = res.id;
    viewing = res.id;
    follow(res.id);
    setStatus("idle");
    await listSessions();
    refreshControls();
  } catch (e) { add("error", escape(e.message)); }
  $("new").disabled = false;
}

async function endSession() {
  if (!active) return;
  try { await api("/session/stop", { method: "POST" }); }
  catch (e) { add("error", escape(e.message)); }
  active = null;
  running = false;
  setStatus("ended");
  await listSessions();
  refreshControls();
}

async function sendMessage() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  try { await api("/message", { method: "POST", body: JSON.stringify({ text }) }); }
  catch (e) { add("error", escape(e.message)); }
}

function stopThinking() {
  api("/session/interrupt", { method: "POST" }).catch((e) => add("error", escape(e.message)));
}

$("new").onclick = newSession;
$("end").onclick = endSession;
$("send").onclick = () => (running && active && viewing === active ? stopThinking() : sendMessage());
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

(async () => {
  const { models, default: def } = await api("/models");
  $("model").replaceChildren(...Object.entries(models).map(([key, m]) => {
    const opt = new Option(m.label, key);
    opt.selected = key === def;
    return opt;
  }));
  const { active: current } = await api("/sessions");
  if (current) { active = current; viewing = current; follow(current); }
  await listSessions();
  refreshControls();
})();
</script>
</body>
</html>
