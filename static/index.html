<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XAS Allocation Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e7ee;
    --fg: #1e2430; --dim: #6b7484; --accent: #2f6feb; --warn: #b45309; --err: #c02626;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr;
         background: var(--bg); color: var(--fg); font-size: 14px; }

  aside { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
             color: var(--dim); margin: 0; padding: 16px; border-bottom: 1px solid var(--line); }
  .controls { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .sessions { overflow-y: auto; padding: 8px; flex: 1; min-height: 0; }
  .session { padding: 8px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .session:hover { background: #eef1f5; }
  .session.viewing { border-color: var(--accent); background: #eaf1ff; }
  .session .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--fg);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

  main { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 12px; align-items: center; background: var(--panel); }
  #title { font-family: ui-monospace, monospace; font-size: 12px; }
  #status { font-size: 12px; color: var(--dim); }
  #status.running { color: var(--accent); }
  #status.error { color: var(--err); }

  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex;
                flex-direction: column; gap: 10px; min-height: 0; }
  .msg { max-width: 780px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
         overflow-wrap: anywhere; line-height: 1.5; }
  .msg.user { background: #dce8ff; align-self: flex-end; }
  .msg.agent { background: var(--panel); border: 1px solid var(--line); }
  .msg.tool { background: transparent; color: var(--dim); font-family: ui-monospace, monospace;
              font-size: 12px; padding: 2px 12px; }
  .msg.tool b { color: var(--warn); font-weight: 600; }
  .msg.tool_result { background: #f2f4f8; border: 1px solid var(--line);
                     font-family: ui-monospace, monospace; font-size: 12px; }
  .msg.tool_result summary { cursor: pointer; color: var(--warn); }
  .msg.tool_result pre { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
                         max-height: 320px; overflow-y: auto; color: var(--fg); }
  .msg.error { background: #fdeaea; color: #8a1c1c; border: 1px solid #f2c2c2; }

  footer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px;
           background: var(--panel); }
  textarea { flex: 1; resize: none; height: 62px; background: #fff; color: var(--fg);
             border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  button, select { background: #eef1f5; color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  #send { min-width: 76px; }
</style>
</head>
<body>
<aside>
  <h1>XAS Allocation</h1>
  <div class="controls">
    <select id="model"></select>
    <button id="new" class="primary">New session</button>
    <button id="end" class="danger" disabled>End session</button>
  </div>
  <div class="sessions" id="sessions"></div>
</aside>

<main>
  <header>
    <strong id="title">No session</strong>
    <span id="status">idle</span>
  </header>
  <div id="transcript"></div>
  <footer>
    <textarea id="input" placeholder="Describe the disruption and your steering instruction…" disabled></textarea>
    <button id="send" class="primary" disabled>Send</button>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let active = null;   // the server's active session — the one messages reach
let viewing = null;  // the session whose transcript is on screen
let running = false; // is the agent currently working?
let stream = null;

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

const escape = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function setStatus(text, cls = "") {
  $("status").textContent = text;
  $("status").className = cls;
}

function refreshControls() {
  const messageable = !!active && viewing === active;   // can only send to the active session
  $("input").disabled = !messageable;
  $("end").disabled = !messageable;
  $("title").textContent = viewing || "No session";

  const send = $("send");
  if (messageable && running) {
    // While the agent is thinking, Send becomes Stop (interrupt).
    send.disabled = false;
    send.textContent = "Stop";
    send.className = "danger";
  } else {
    send.disabled = !messageable;
    send.textContent = "Send";
    send.className = "primary";
  }
}

function add(kind, html) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  $("transcript").append(div);
  $("transcript").scrollTop = $("transcript").scrollHeight;
}

function render(event) {
  switch (event.type) {
    case "user":  return add("user", escape(event.text));
    case "agent": return add("agent", escape(event.text));
    case "tool":  return add("tool", `<b>${escape(event.name)}</b> ${escape(event.detail)}`);
    case "tool_result":
      return add("tool_result",
        `<details><summary>pull result (${event.text.length} chars)</summary>`
        + `<pre>${escape(event.text)}</pre></details>`);
    case "error": return add("error", escape(event.text));
    case "status":
      if (event.status === "running") { running = true; setStatus("running…", "running"); }
      else if (event.status === "idle") {
        if (event.stop_reason === "requires_action") { running = true; setStatus("working (pulling data)…", "running"); }
        else { running = false; setStatus("idle"); }
      } else { running = false; setStatus(event.status); }
      refreshControls();
      return;
  }
}

function follow(id) {
  if (stream) stream.close();
  running = false;
  $("transcript").replaceChildren();
  stream = new EventSource(`/session/${id}/events`);
  stream.onmessage = (e) => render(JSON.parse(e.data));
  stream.onerror = () => setStatus("stream lost — reload to resume", "error");
}

async function listSessions() {
  const { sessions } = await api("/sessions");
  $("sessions").replaceChildren(...sessions.map((s) => {
    const div = document.createElement("div");
    div.className = "session" + (s.id === viewing ? " viewing" : "");
    const tags = [s.status, s.model || "—"];
    if (s.id === active) tags.push("active");
    if (s.archived) tags.push("archived");
    div.innerHTML = `<div class="id">${escape(s.id)}</div>`
      + `<div class="meta">${escape(tags.join(" · "))}</div>`;
    div.onclick = () => selectSession(s);
    return div;
  }));
}

async function selectSession(s) {
  if (s.archived) {
    // Read-only: show the transcript but don't make it the active session.
    viewing = s.id;
    follow(s.id);
    setStatus("archived — read-only");
    await listSessions();
    refreshControls();
    return;
  }
  try {
    await api(`/session/${s.id}/activate`, { method: "POST" });
    active = s.id;
    viewing = s.id;
    follow(s.id);
  } catch (e) { add("error", escape(e.message)); return; }
  await listSessions();
  refreshControls();
}

async function newSession() {
  $("new").disabled = true;
  try {
    const res = await api("/session", { method: "POST", body: JSON.stringify({ model: $("model").value }) });
    active = res.id;
    viewing = res.id;
    follow(res.id);
    setStatus("idle");
    await listSessions();
    refreshControls();
  } catch (e) { add("error", escape(e.message)); }
  $("new").disabled = false;
}

async function endSession() {
  if (!active) return;
  try { await api("/session/stop", { method: "POST" }); }
  catch (e) { add("error", escape(e.message)); }
  active = null;
  running = false;
  setStatus("ended");
  await listSessions();
  refreshControls();
}

async function sendMessage() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  try { await api("/message", { method: "POST", body: JSON.stringify({ text }) }); }
  catch (e) { add("error", escape(e.message)); }
}

function stopThinking() {
  api("/session/interrupt", { method: "POST" }).catch((e) => add("error", escape(e.message)));
}

$("new").onclick = newSession;
$("end").onclick = endSession;
$("send").onclick = () => (running && active && viewing === active ? stopThinking() : sendMessage());
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

(async () => {
  const { models, default: def } = await api("/models");
  $("model").replaceChildren(...Object.entries(models).map(([key, m]) => {
    const opt = new Option(m.label, key);
    opt.selected = key === def;
    return opt;
  }));
  const { active: current } = await api("/sessions");
  if (current) { active = current; viewing = current; follow(current); }
  await listSessions();
  refreshControls();
})();
</script>
</body>
</html>
